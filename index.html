<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Gestión de Ventas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>JYA IMPORT ELECTRO</h1>
        <p>Gestión de Ventas</p>
    </div>
</header>

<main class="container">

    <section class="card">

        <h2>Registrar venta</h2>

        <form id="ventaForm">

            <div class="grid">

                <div>
                    <label>Número de cliente</label>
                    <input
                        type="text"
                        id="numeroCliente"
                        placeholder="Ej: C-0001"
                        required
                    >
                </div>

                <div>
                    <label>Nombre del cliente</label>
                    <input
                        type="text"
                        id="nombreCliente"
                        placeholder="Nombre completo"
                        required
                    >
                </div>

                <div>
                    <label>Celular</label>
                    <input
                        type="tel"
                        id="celular"
                        placeholder="999999999"
                    >
                </div>

                <div>
                    <label>Tipo de destino</label>

                    <select id="destinoTipo" required>
                        <option value="">Seleccionar</option>
                        <option value="Lima">Lima</option>
                        <option value="Provincia">Provincia</option>
                    </select>
                </div>

                <div>
                    <label>Destino</label>

                    <input
                        type="text"
                        id="destino"
                        placeholder="Ej: Puente Piedra / Piura"
                        required
                    >
                </div>

                <div>
                    <label>Producto</label>

                    <input
                        type="text"
                        id="producto"
                        placeholder="Ej: Wahl Magic Clip"
                        required
                    >
                </div>

                <div>
                    <label>Cantidad</label>

                    <input
                        type="number"
                        id="cantidad"
                        min="1"
                        value="1"
                        required
                    >
                </div>

                <div>
                    <label>Monto pagado</label>

                    <input
                        type="number"
                        id="monto"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                </div>

                <div>
                    <label>Método de pago</label>

                    <select id="metodoPago" required>
                        <option value="">Seleccionar</option>
                        <option value="Yape">Yape</option>
                        <option value="Plin">Plin</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="Efectivo">Efectivo</option>
                    </select>
                </div>

                <div>
                    <label>Nombre del Yape</label>

                    <input
                        type="text"
                        id="nombreYape"
                        placeholder="Nombre que aparece en Yape"
                    >
                </div>

            </div>

            <div>
                <label>Observaciones</label>

                <textarea
                    id="observaciones"
                    placeholder="Ej: Enviar por Shalom, llamar antes de entregar..."
                ></textarea>
            </div>

            <button type="submit" class="btn">
                Registrar venta
            </button>

        </form>

    </section>


    <section class="resumen">

        <div class="stat">
            <span>Total ventas</span>
            <strong id="totalVentas">0</strong>
        </div>

        <div class="stat">
            <span>Total recaudado</span>
            <strong>S/ <span id="totalDinero">0.00</span></strong>
        </div>

        <div class="stat">
            <span>Lima</span>
            <strong id="totalLima">0</strong>
        </div>

        <div class="stat">
            <span>Provincia</span>
            <strong id="totalProvincia">0</strong>
        </div>

    </section>


    <section class="card">

        <div class="tabla-header">

            <h2>Ventas registradas</h2>

            <input
                type="text"
                id="buscar"
                placeholder="🔎 Buscar cliente, producto..."
            >

        </div>

        <div class="tabla-container">

            <table>

                <thead>

                    <tr>
                        <th>Cliente</th>
                        <th>Nombre</th>
                        <th>Destino</th>
                        <th>Producto</th>
                        <th>Pago</th>
                        <th>Yape</th>
                        <th>Monto</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody id="tablaVentas"></tbody>

            </table>

        </div>

    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
