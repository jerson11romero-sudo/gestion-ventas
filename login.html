<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - JYA IMPORT ELECTRO</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">

        <h1>JYA IMPORT ELECTRO</h1>

        <p>Acceso al sistema</p>

    </div>

</header>


<main class="container">

    <section class="card login-card">

        <h2>Iniciar sesión</h2>


        <form id="loginForm">

            <div>

                <label>Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >

            </div>


            <div>

                <label>Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn">

                INGRESAR

            </button>

        </form>


        <p
            id="loginError"
            style="
                margin-top:20px;
                text-align:center;
                font-weight:bold;
            ">
        </p>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

console.log("1. JavaScript cargado");


const SUPABASE_URL =
    "https://labgklmijzytxzjsrwxe.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_4XzzjrO_JNsDjIiD0ttSBg_QcmkbiuN";


console.log("2. URL:", SUPABASE_URL);


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


console.log("3. Supabase conectado");


const loginForm =
    document.getElementById("loginForm");


const loginError =
    document.getElementById("loginError");


loginForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        console.log("4. BOTÓN INGRESAR PRESIONADO");


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        console.log(
            "5. Correo:",
            email
        );


        console.log(
            "6. Intentando conectar con Supabase..."
        );


        loginError.textContent =
            "⏳ Conectando...";


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        console.log(
            "7. RESPUESTA SUPABASE"
        );


        console.log(
            "DATA:",
            data
        );


        console.log(
            "ERROR:",
            error
        );


        if (error) {

            loginError.textContent =
                "❌ " + error.message;

            return;

        }


        if (!data.session) {

            loginError.textContent =
                "❌ No se creó la sesión.";

            return;

        }


        loginError.textContent =
            "✅ LOGIN CORRECTO";


        console.log(
            "8. SESIÓN CORRECTA"
        );


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            1000
        );

    }

);

</script>


</body>

</html>
