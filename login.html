<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JYA IMPORT ELECTRO - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>JYA IMPORT ELECTRO</h1>
        <p>Acceso al sistema</p>
    </div>
</header>

<main class="container">

    <section class="card login-card">

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <div>
                <label>Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >
            </div>

            <div>
                <label>Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >
            </div>

            <button type="submit" class="btn">
                INGRESAR
            </button>

        </form>

        <p
            id="loginError"
            style="margin-top:20px;text-align:center;font-weight:bold;">
        </p>

    </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

console.log("PASO 1: JavaScript funcionando");


const SUPABASE_URL =
    "https://labgklmijzytxzjsrwxe.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_4XzzjrO_JNsDjIiD0ttSBg_QcmkbiuN";


console.log("PASO 2: URL correcta");


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


console.log("PASO 3: Supabase conectado");


const loginForm =
    document.getElementById("loginForm");


const loginError =
    document.getElementById("loginError");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        console.log("PASO 4: BOTÓN PRESIONADO");


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        console.log(
            "PASO 5: CORREO =",
            email
        );


        loginError.textContent =
            "⏳ Verificando...";


        const resultado =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        console.log(
            "PASO 6: RESPUESTA SUPABASE",
            resultado
        );


        if (resultado.error) {

            console.error(
                "ERROR:",
                resultado.error
            );

            loginError.textContent =
                "❌ " +
                resultado.error.message;

            return;
        }


        console.log(
            "PASO 7: LOGIN CORRECTO"
        );


        loginError.textContent =
            "✅ Acceso correcto";


        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 1000);

    }
);

</script>

</body>

</html>
