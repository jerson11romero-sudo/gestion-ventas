 <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JYA IMPORT ELECTRO - Acceso</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #1e3a8a 0%, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
                linear-gradient(135deg, #050816, #0f172a 55%, #111827);

            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* FONDO DECORATIVO */

        body::before {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.12);
            filter: blur(80px);
            top: -150px;
            left: -100px;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.12);
            filter: blur(80px);
            bottom: -150px;
            right: -100px;
        }

        /* HEADER */

        header {
            width: 100%;
            padding: 35px 20px 10px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #60a5fa,
                #a78bfa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        /* CONTENEDOR */

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* CARD */

        .login-card {
            width: 100%;
            max-width: 430px;

            padding: 42px 38px;

            background: rgba(15, 23, 42, 0.75);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: aparecer 0.7s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* TITULO */

        .login-card h2 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .login-card h2::after {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin: 12px auto 0;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #3b82f6,
                #8b5cf6
            );
        }

        /* CAMPOS */

        form > div {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border-radius: 12px;

            border: 1px solid rgba(148, 163, 184, 0.2);

            background: rgba(2, 6, 23, 0.65);

            color: white;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.15);

            background: rgba(2, 6, 23, 0.85);
        }

        /* BOTON */

        .btn {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 13px;

            color: white;

            font-size: 14px;
            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);

            transition: all 0.3s ease;

            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(124, 58, 237, 0.35);

            filter: brightness(1.08);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* MENSAJE */

        #loginError {
            min-height: 22px;

            font-size: 13px;

            border-radius: 8px;

            transition: 0.3s;
        }

        /* FOOTER */

        .login-card::after {
            content: "JYA IMPORT ELECTRO • Sistema de Gestión";

            display: block;

            text-align: center;

            margin-top: 28px;

            font-size: 11px;

            color: #64748b;

            letter-spacing: 0.5px;
        }

        /* CELULAR */

        @media (max-width: 500px) {

            header {
                padding-top: 25px;
            }

            .logo h1 {
                font-size: 22px;
            }

            .login-card {
                padding: 32px 24px;
                border-radius: 20px;
            }

            .login-card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">

        <h1>JYA IMPORT ELECTRO</h1>

        <p>Acceso al sistema de gestión</p>

    </div>

</header>


<main class="container">

    <section class="card login-card">

        <h2>Iniciar sesión</h2>

        <form id="loginForm">

            <div>

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div>

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
                id="loginButton">

                INGRESAR AL SISTEMA

            </button>

        </form>


        <p id="loginError"></p>

    </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

console.log("PASO 1: JavaScript funcionando");


const SUPABASE_URL =
    "https://labgklmijzytxzjsrwxe.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_4XzzjrO_JNsDjIiD0ttSBg_QcmkbiuN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


console.log("PASO 2: Supabase conectado");


const loginForm =
    document.getElementById("loginForm");


const loginError =
    document.getElementById("loginError");


const loginButton =
    document.getElementById("loginButton");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginError.textContent =
            "⏳ Verificando acceso...";

        loginError.style.color =
            "#fbbf24";


        loginButton.disabled = true;

        loginButton.textContent =
            "VERIFICANDO...";


        const resultado =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        console.log(
            "RESPUESTA SUPABASE:",
            resultado
        );


        if (resultado.error) {

            console.error(
                "ERROR:",
                resultado.error
            );


            loginError.textContent =
                "❌ " + resultado.error.message;

            loginError.style.color =
                "#f87171";


            loginButton.disabled = false;

            loginButton.textContent =
                "INGRESAR AL SISTEMA";


            return;
        }


        loginError.textContent =
            "✅ Acceso correcto. Bienvenido.";


        loginError.style.color =
            "#4ade80";


        loginButton.textContent =
            "ACCESO CORRECTO";


        setTimeout(function() {

            window.location.href =
                "index.html";

        }, 1000);

    }

);

</script>


</body>

</html>
