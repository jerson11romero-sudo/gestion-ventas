<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - JYA IMPORT ELECTRO</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">

        <h1>JYA IMPORT ELECTRO</h1>

        <p>Acceso al sistema</p>

    </div>

</header>


<main class="container">


    <section class="card login-card">


        <h2>Iniciar sesión</h2>


        <form id="loginForm">


            <div>

                <label>
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >

            </div>


            <div>

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn">

                Ingresar

            </button>


        </form>


        <p
            id="loginError"
            style="color:red; margin-top:15px;">
        </p>


    </section>


</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
    "https://labgklmijzytxzjsrwxe.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_4XzzjrO_JNsDjIiD0ttSBg_QcmkbiuN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ========================================
// ELEMENTOS
// ========================================

const loginForm =
    document.getElementById("loginForm");


const loginError =
    document.getElementById("loginError");


// ========================================
// LOGIN
// ========================================

loginForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();


        loginError.textContent =
            "Iniciando sesión...";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        console.log("Correo:", email);


        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            console.error(
                "ERROR SUPABASE:",
                error
            );


            loginError.textContent =
                "❌ " + error.message;


            return;

        }


        console.log(
            "LOGIN CORRECTO:",
            data
        );


        loginError.textContent =
            "✅ Acceso correcto";


        window.location.href =
            "index.html";

    }

);

</script>


</body>

</html>
